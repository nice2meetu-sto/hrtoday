<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인원현황 대시보드 — 서울관광재단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --main:#534AB7; --main-soft:#ece9fb; --main-line:#cfc8f2;
  --valid:#3B6D11; --warn:#A32D2D; --amber:#b8860b;
  --border:#e2e4ea; --ink:#2a2c33; --ink2:#6b6f7a; --bg:#f5f6f8; --card:#ffffff;
  /* 제도 대분류 색상 (단축/휴가/휴직, 그 외 기타) */
  --c-단축:#5b9bd5; --c-휴가:#e09a6b; --c-휴직:#8b80e0; --c-기타:#9aa0ad;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px 80px}

header{position:sticky;top:0;z-index:50;background:rgba(245,246,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.head-in{max-width:1320px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .k{font-size:11px;letter-spacing:.18em;color:var(--main);font-weight:700}
.brand h1{font-size:19px;font-weight:900;letter-spacing:-.01em}
.head-ctrl{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.datebox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px 6px 14px}
.datebox label{font-size:12px;color:var(--ink2);font-weight:500}
.datebox input{border:none;font-family:inherit;font-size:14px;font-weight:700;color:var(--main);background:transparent}
.datebox input:focus{outline:none}
.btn{font-family:inherit;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--main-line);background:var(--main-soft)}
.btn:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.btn.primary{background:var(--main);border-color:var(--main);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:default}

.statusbar{max-width:1320px;margin:0 auto;padding:0 24px}
.statusbar .msg{margin-top:14px;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;display:none}
.statusbar .msg.show{display:block}
.statusbar .msg.loading{background:var(--main-soft);color:var(--main);border:1px solid var(--main-line)}
.statusbar .msg.error{background:#f7dada;color:var(--warn);border:1px solid #e6b3b3}
.statusbar .msg.sample{background:#fbeec9;color:var(--amber);border:1px solid #ecd9a0}

.tabs{display:flex;gap:4px;margin:22px 0 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{font-family:inherit;font-size:14px;font-weight:700;color:var(--ink2);background:none;border:none;padding:11px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--main);border-bottom-color:var(--main)}
.tab:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.panel{display:none}.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.kpi .lab{font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:6px}
.kpi .num{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1}
.kpi .sub{font-size:11px;color:var(--ink2);margin-top:6px}
.kpi .numsub{font-size:11px;font-weight:500;color:var(--ink2);margin-left:8px;letter-spacing:0}
.kpi.accent .num{color:var(--main)}
.kpi.leavebox{cursor:pointer;text-align:left;font-family:inherit;width:100%;transition:.15s}
.kpi.leavebox:hover{border-color:var(--main-line);background:var(--main-soft)}
.kpi.leavebox.on{border-color:var(--main);background:var(--main-soft)}
.kpi.leavebox .lab{display:flex;align-items:center;gap:6px}
.kpi.leavebox .num{font-size:26px}
.kpi.leavebox .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

.tl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.tl-title{font-size:16px;font-weight:900}
.tl-title span{color:var(--ink2);font-weight:500;font-size:13px;margin-left:6px}
.search{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px 12px;font-family:inherit;font-size:13px;width:220px}
.search:focus{outline:none;border-color:var(--main-line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.tlcard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.tl-scale{position:relative;height:30px;margin-left:190px;border-bottom:1px solid var(--border)}
.tl-month{position:absolute;top:0;height:100%;border-left:1px dashed #eef0f3;font-size:10px;color:var(--ink2);padding:8px 0 0 5px}
.tl-row{display:flex;align-items:stretch;border-bottom:1px solid #f1f2f5;min-height:52px}
.tl-row:last-child{border-bottom:none}
.tl-row:hover{background:#f1eefb}
.tl-name{width:190px;flex-shrink:0;padding:9px 14px;border-right:1px solid var(--border)}
.tl-name .nm{font-weight:700;font-size:13px}
.tl-name .meta{font-size:11px;color:var(--ink2)}
.tl-track{position:relative;flex:1;margin:8px 0}
.seg{position:absolute;height:24px;top:50%;transform:translateY(-50%);border-radius:6px;font-size:11px;font-weight:500;color:#fff;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;cursor:default}
.seg.future{opacity:.62;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);z-index:5}
.nowline::after{content:none}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-family:inherit;font-size:14px;font-weight:700;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:9px 18px;cursor:pointer}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.subchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.subchip{font-family:inherit;font-size:12px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 13px;cursor:pointer;color:var(--ink2)}
.subchip.on{background:var(--main-soft);border-color:var(--main-line);color:var(--main);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col h3{font-size:14px;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.col .cnt{font-size:12px;color:var(--ink2);font-weight:500}
.col .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.prow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.prow .top{display:flex;align-items:baseline;gap:8px}
.prow .nm{font-weight:700}.prow .dept{font-size:12px;color:var(--ink2)}
.prow .pg{font-size:11px;color:#fff;border-radius:5px;padding:1px 7px;font-weight:500}
.prow .range{font-size:12px;color:var(--ink2);margin-top:5px}
.prow .detail{font-size:12px;color:var(--main);margin-top:3px;font-weight:500}
.dday{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.dday.now{background:var(--main-soft);color:var(--main)}
.dday.soon{background:#fbeec9;color:var(--amber)}
.dday.urgent{background:#f7dada;color:var(--warn)}
.empty{color:var(--ink2);font-size:13px;padding:24px;text-align:center;background:var(--card);border:1px dashed var(--border);border-radius:12px}

.cal-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.cal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav .mlabel{font-size:16px;font-weight:900}
.cal-nav button{border:1px solid var(--border);background:var(--card);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
.cal-nav button:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.cal-table{width:100%;border-collapse:collapse;table-layout:fixed;flex:1 1 auto;height:100%}
.cal-table tbody{height:100%}
.cal-table th{font-size:11px;color:var(--ink2);font-weight:500;padding:6px 0}
.cal-table td{height:62px;vertical-align:top;border:1px solid #f1f2f5;padding:4px;font-size:11px;position:relative}
.cal-table td .d{color:var(--ink2);font-weight:500}
.cal-table td.today{background:var(--main-soft)}
.cal-table td.today .d{color:var(--main);font-weight:900}
.cal-pop{display:none;position:absolute;z-index:30;top:100%;left:0;min-width:170px;max-width:260px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.14);padding:9px 10px}
.cal-table td:hover .cal-pop{display:block}
.cal-pop-h{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:6px}
.cal-pop-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:var(--ink);white-space:nowrap}
.cal-pop-row i{width:8px;height:8px;border-radius:2px;flex-shrink:0;display:inline-block}
.dpager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px;font-size:12px;color:var(--ink2)}
.dpager .btn{padding:5px 10px;font-size:12px}
.ev{display:block;font-size:10px;font-weight:500;color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist h3{font-size:14px;font-weight:900;margin-bottom:12px}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.dcard .et{font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:2px 7px;flex-shrink:0}
.dcard .info{flex:1;min-width:0}
.dcard .info .n{font-weight:700;font-size:13px}
.dcard .info .dt{font-size:11px;color:var(--ink2)}

.rtop{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.rtop2{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;font-size:12px}
.rtop2 .flab{font-weight:700;color:var(--ink2)}
.rtop2 .sep{color:var(--ink2)}
.dfilter{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:12px;color:var(--ink)}
.dfilter:focus{outline:none;border-color:var(--main-line)}
.rtable th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.rtable th.sortable:hover{color:var(--main)}
.rtable th.sortable .arr{color:var(--main);font-size:10px}
.rtable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.rtable th{background:#fafbfc;font-size:12px;color:var(--ink2);font-weight:700;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border)}
.rtable td{padding:10px 14px;border-bottom:1px solid #f1f2f5;font-size:13px}
.rtable tbody tr:last-child td{border-bottom:none}
.rtable tbody tr:hover{background:#f1eefb}
.tag{display:inline-block;font-size:11px;font-weight:500;color:#fff;border-radius:5px;padding:2px 7px;margin:1px 2px 1px 0;cursor:help}
.statuschip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 9px;white-space:nowrap}
.st-재직{background:#e6f0e1;color:#3B6D11}
.st-휴직{background:#efeafb;color:#534AB7}
.st-퇴사{background:#ececef;color:#6b6f7a}
.st-입사예정{background:#e3eefb;color:#2f6bb0}

.note{font-size:12px;color:var(--ink2);background:#fff;border:1px dashed var(--border);border-radius:10px;padding:12px 16px;margin-top:18px;line-height:1.7}
.note b{color:var(--ink)}

/* ===== 호버 효과 ===== */
.tab{transition:color .15s,background .15s}
.tab:not(.on):hover{color:var(--ink);background:var(--main-soft)}
.subchip{transition:.15s}
.subchip:not(.on):hover{border-color:var(--main-line);color:var(--main);background:var(--main-soft)}
.chip{transition:.15s}
.chip:not(.on):hover{border-color:var(--main-line);background:var(--main-soft)}
.kpi{transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi:hover{box-shadow:0 5px 16px rgba(40,42,55,.08)}
.kpi.leavebox:hover{transform:translateY(-1px)}
.prow{transition:border-color .15s,box-shadow .15s}
.prow:hover{border-color:var(--main-line);box-shadow:0 4px 12px rgba(83,74,183,.10)}
.dcard{transition:border-color .15s,box-shadow .15s}
.dcard:hover{border-color:var(--main-line);box-shadow:0 4px 12px rgba(83,74,183,.10)}
.cal,.tlcard{transition:box-shadow .15s}
.cal:hover,.tlcard:hover{box-shadow:0 5px 18px rgba(40,42,55,.06)}
.cal-nav button{transition:.15s}
.cal-nav button:hover{background:var(--main-soft);border-color:var(--main-line)}
.cal-table td{transition:background .12s}
.cal-table td:hover{background:#f1eefb}
.seg{transition:filter .15s}
.seg:hover{filter:brightness(1.07)}
.search,.dfilter{transition:border-color .15s,box-shadow .15s}
.search:hover,.dfilter:hover{border-color:var(--main-line)}
/* 테이블 행 음영(명단·휴직자·예정자) — 타임라인과 동일한 옅은 회색 */
.rtable tbody tr{transition:background .12s}
.rtable tbody tr:hover{background:#f1eefb}

/* 인원현황표 */
.staff-note{font-size:12px;color:var(--amber);margin:0 0 10px}
.staff-h{font-size:15px;font-weight:900;margin:20px 0 8px}
.staff-h:first-of-type{margin-top:6px}
.staff-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.staff-table{border-collapse:collapse;font-size:12px;width:100%;min-width:760px}
.staff-table th,.staff-table td{border:1px solid var(--border);padding:6px 9px;text-align:center;white-space:nowrap}
.staff-table th{background:#edeef1;color:var(--ink);font-weight:700}
.staff-table tbody td:first-child,.staff-table th:first-child{position:sticky;left:0;z-index:1;text-align:left;font-weight:700}
.staff-table tbody td:first-child{background:var(--card)}
.staff-table tbody tr:hover td{background:#e9ebef}
.staff-table tbody tr:hover td:first-child{background:#e9ebef}
.staff-table .sumcol{font-weight:800}
.staff-table .sumrow td{font-weight:900;background:#eef0f3}
.staff-table .neg{color:var(--warn)}
/* 소계/총계 열은 행 음영과 무관하게 항상 옅은 회색 (id 선택자로 음영보다 우선) */
#staffRankTbl .sumcol,#staffQuotaTbl .sumcol{background:#eef0f3}
/* 직급별 표 팀 행 음영(표시순서 구간별) */
.staff-table .shade-y td,.staff-table .shade-y td:first-child{background:#fcf6db}
.staff-table .shade-o td,.staff-table .shade-o td:first-child{background:#fbe9d6}
.staff-table .shade-g td,.staff-table .shade-g td:first-child{background:#e8f4e4}
/* 직급별 인원 현황 — 첨부 디자인(성별 분할·파스텔 컬럼·십자 호버·부서 모달) */
.table-scroll{overflow-x:auto;border-radius:14px}
table.gradegrid{border-collapse:collapse;width:100%;background:var(--card);font-size:12.5px;min-width:1100px;border:1px solid var(--border);border-radius:14px}
table.gradegrid th,table.gradegrid td{border:1px solid var(--border);padding:7px 9px;text-align:center;white-space:nowrap}
table.gradegrid thead th{background:#f0f1f6;color:#41434f;font-weight:700}
table.gradegrid thead tr.group th{background:#e9eaf2}
table.gradegrid td.dept,table.gradegrid th.dept{text-align:left;font-weight:500;position:sticky;left:0;background:var(--card);z-index:1}
table.gradegrid td.dept.clickable{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(0,0,0,.25)}
table.gradegrid td.dept.clickable:hover{color:#000;text-decoration-color:var(--main)}
table.gradegrid tr.total td{font-weight:700;border-top:2px solid #9aa1b2}
table.gradegrid tr.bb-top td{border-top:2px solid #b3b8c5}      /* ~~본부 행 윗줄 */
table.gradegrid tr.bb-bot td{border-bottom:2px solid #b3b8c5}   /* 대표이사 행 아랫줄 */
table.gradegrid td.zero{color:#c2c5d0}
table.gradegrid td.num{font-variant-numeric:tabular-nums}
table.gradegrid td.cur{font-weight:700;color:var(--main)}
table.gradegrid .e-gen{background:#eef4fc} table.gradegrid .e-gen.esub{background:#e0ebf9}
table.gradegrid .e-lav{background:#f1eff9} table.gradegrid .e-lav.esub{background:#e9e5f6}
table.gradegrid .e-gig{background:#f1f3f6} table.gradegrid .e-gig.esub{background:#e8ebef}
table.gradegrid .e-pink{background:#fcebeb} table.gradegrid .e-pink.esub{background:#f8dede}
table.gradegrid .e-gry2{background:#e4e7ec} table.gradegrid .e-gry2.esub{background:#d7dbe2}
table.gradegrid tbody tr:hover td{background:#fafbfd !important}
table.gradegrid td.col-hl{background:#fafbfd !important}
table.gradegrid tbody tr:hover td.col-hl{background:#eef0f3 !important}
table.gradegrid td.e-gen.esub.col-hl{background:#cadcf4 !important}
table.gradegrid td.e-lav.esub.col-hl{background:#ddd6f0 !important}
table.gradegrid td.e-gig.esub.col-hl{background:#dadee4 !important}
table.gradegrid td.e-pink.esub.col-hl{background:#f3cccc !important}
table.gradegrid td.e-gry2.esub.col-hl{background:#c8cdd7 !important}
table.gradegrid .sep-left{border-left:2px solid #cdd0db}
.staff-foot{margin:9px 0 0;font-size:11px;color:var(--ink2)}
/* 조직도 */
.org-legend{display:flex;gap:12px;font-size:11px;color:var(--ink2);flex-wrap:wrap}
.org-legend span{display:inline-flex;align-items:center;gap:5px}
.org-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.org-legend .lg-ct{background:#fdf3cf} .org-legend .lg-disp{background:#dbe8fb} .org-legend .lg-leave{background:#eaeaec}
.org-chart{display:flex;flex-direction:column;gap:18px;align-items:center}
.org-ceo{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.org-jiksok{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.org-bonbus{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;width:100%;align-items:start}
.org-bonbu{border:1px solid var(--border);border-radius:14px;background:#fafbfc;padding:12px;display:flex;flex-direction:column;gap:10px}
.org-bonbu-h{text-align:center;font-weight:900;font-size:14px;color:var(--ink);padding:6px 8px}
.org-team{border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden}
.org-team.lead{border:2px solid var(--main)}
.org-team.lead .org-team-h{background:var(--main-soft)}
.org-ceo .org-team,.org-jiksok .org-team{min-width:210px}
.org-team-h{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f0f1f6;border:none;border-bottom:1px solid var(--border);cursor:pointer;font-family:inherit;text-align:left;transition:background .15s}
.org-team-h:hover{background:var(--main-soft)}
.org-team-h .otname{font-weight:800;font-size:13px}

<body>
<header>
  <div class="head-in">
    <div class="brand">
      <span class="k">서울관광재단</span>
      <h1>인원현황 대시보드</h1>
    </div>
    <div class="head-ctrl">
      <div class="datebox">

      </div>
      <button class="btn" onclick="setToday()">오늘</button>
      <button class="btn" onclick="openDB()">🗄 DB</button>
      <button class="btn primary" id="refreshBtn" onclick="loadData()">↻ 새로고침</button>
    </div>
  </div>
  <div class="statusbar"><div class="msg" id="statusMsg" role="status" aria-live="polite"></div></div>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" onclick="tab(0)">기준일 현황</button>
    <button class="tab" onclick="tab(1)">조직도</button>
    <button class="tab" onclick="tab(2)">전체 명단</button>
    <button class="tab" onclick="tab(3)">휴직자</button>
    <button class="tab" onclick="tab(4)">예정자</button>
    <button class="tab" onclick="tab(5)">제도별 조회</button>
    <button class="tab" onclick="tab(6)">타임라인</button>
  </div>

  <!-- TAB 0: 기준일 현황 (KPI + 캘린더) -->
  <section class="panel on" id="p0">
    <div class="kpis" id="kpis"></div>
    <div class="cal-grid">
      <div class="cal">
        <div class="cal-nav">
          <button onclick="calMove(-1)" aria-label="이전 달">‹</button>
          <span class="mlabel" id="calLabel"></span>
          <button onclick="calMove(1)" aria-label="다음 달">›</button>
        </div>
        <table class="cal-table">
          <thead><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead>
          <tbody id="calBody"></tbody>
        </table>
      </div>
      <div class="dlist">
        <h3>도래 예정 일정 (D-day)</h3>

  <!-- TAB: 인원현황표 (직급별 + 정현원, 항상 조회일(KST) 기준) -->

  <!-- TAB: 예정자 -->

    </div>
    <div id="upcomingWrap"></div>

  <!-- TAB 1: 제도별 조회 -->

    <div class="subchips" id="subchips"></div>
    <div class="two">

    <div class="tl-head">

    <div class="note">
      <b>읽는 법</b> — 가로축은 기준일 <b>-3개월 ~ +12개월</b>. 빨간 세로선이 기준일입니다.
      선을 지나는 막대 = <b>현재 사용 중</b>, 선 오른쪽 빗금 막대 = <b>사용 예정</b>.
      <br>한 사람이 임신기단축 → 산전후휴가 → 육아휴직처럼 여러 제도를 이어 쓰면 한 줄에 막대가 여러 개로 표시됩니다.
    </div>

</div>

<script>
/* =========================================================
   ▼▼▼ 설정 — 배포된 Apps Script 웹앱 URL 을 넣으세요 ▼▼▼
   - 비워두면(SCRIPT_URL="") 내장 샘플 데이터로 화면이 그대로 열립니다.
   - URL 을 넣으면 그 즉시 구글시트 실데이터를 fetch 합니다.
   인원 시트 헤더:  사번 · 사원명 · 부서 · 직급 · 고용형태 · 입사일 · 퇴사일
   제도 시트 헤더:  사번 · 제도 · 시작일 · 종료일 · 상세 · 비고
   (날짜는 YYYY-MM-DD. 퇴사일·종료일 빈칸 가능)
   ========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycNAkVHmX8mP-qlVWv6oA6i8-dLeTZmVaHZ-tiIoGCCqNu9PLMJgeOhVga3BlC4Gfg-Q/exec"; // ← 배포된 Apps Script 웹앱 URL

/* 내장 샘플 데이터 (SCRIPT_URL 미설정 시 표시) — 구글시트 양식과 동일 */
const SAMPLE_PEOPLE = [
  {사번:"1001",사원명:"김도윤",부서:"마케팅팀",직급:"5급",고용형태:"일반직",입사일:"2016-03-02",퇴사일:""},
  {사번:"1008",사원명:"윤하준",부서:"경영지원팀",직급:"6급",고용형태:"일반직",입사일:"2019-05-02",퇴사일:"2026-05-31",비고:"의원면직"},
  {사번:"1023",사원명:"이서연",부서:"관광콘텐츠팀",직급:"5급",고용형태:"일반직",입사일:"2018-09-01",퇴사일:""},
  {사번:"1044",사원명:"박지호",부서:"경영지원팀",직급:"4급",고용형태:"일반직",입사일:"2014-01-06",퇴사일:""},
  {사번:"1075",사원명:"최민서",부서:"MICE팀",직급:"6급",고용형태:"일반직",입사일:"2021-07-01",퇴사일:""},
  {사번:"1090",사원명:"정하늘",부서:"관광콘텐츠팀",직급:"6급",고용형태:"일반직",입사일:"2020-02-03",퇴사일:""},
  {사번:"1112",사원명:"한유진",부서:"마케팅팀",직급:"기간제",고용형태:"기간제",입사일:"2024-04-01",퇴사일:"2026-07-31",비고:"계약기간 만료"},
  {사번:"1130",사원명:"오세훈",부서:"경영지원팀",직급:"5급",고용형태:"일반직",입사일:"2017-11-13",퇴사일:""},
  {사번:"1141",사원명:"신예린",부서:"MICE팀",직급:"6급",고용형태:"일반직",입사일:"2022-08-16",퇴사일:""},
  {사번:"9001",사원명:"강시우",부서:"마케팅팀",직급:"6급",고용형태:"일반직",입사일:"2026-08-01",퇴사일:"",비고:"신규채용(공채)"},
];
const SAMPLE_PROGRAMS = [
  {사번:"1023",제도:"임신기 근로시간 단축",시작일:"2026-05-01",종료일:"2026-10-07",상세:"10:00–17:00",비고:""},
  {사번:"1023",제도:"산전후휴가",시작일:"2026-10-08",종료일:"2027-01-05",상세:"",비고:""},
  {사번:"1023",제도:"육아휴직",시작일:"2027-01-06",종료일:"2029-01-05",상세:"",비고:""},
  {사번:"1090",제도:"육아휴직",시작일:"2025-09-01",종료일:"2026-08-31",상세:"",비고:""},
  {사번:"1090",제도:"육아기 근로시간 단축",시작일:"2026-09-01",종료일:"2027-02-28",상세:"09:00–16:00",비고:"복직후"},
  {사번:"1141",제도:"육아기 근로시간 단축",시작일:"2026-03-02",종료일:"2026-09-01",상세:"10:00–17:00",비고:""},
  {사번:"1130",제도:"질병휴직",시작일:"2026-08-15",종료일:"2026-11-14",상세:"",비고:""},
  {사번:"1075",제도:"산전후휴가",시작일:"2026-07-20",종료일:"2026-10-17",상세:"",비고:""},
];

let PEOPLE = [], PROGRAMS = [];
let TEAMORDER = [], QUOTA = {}, TEAMORD = {}, TEAM_BONBU = {}, BONBU_ORDER = [];   // '팀 순서'/'정원' 시트 (TEAM_BONBU: 팀→본부, BONBU_ORDER: 본부 표시순)
/* ▲▲▲ 설정/데이터 영역 끝 ▲▲▲ */

/* ---- 상태 메시지 ---- */
function setStatus(kind, text){
  const el=document.getElementById('statusMsg');
  if(!kind){ el.className='msg'; el.textContent=''; return; }
  el.className='msg show '+kind; el.textContent=text;
}

/* ---- 데이터 로드 (GET 전용 JSON API) ---- */
async function loadData(){
  const btn=document.getElementById('refreshBtn');
  if(!SCRIPT_URL){
    PEOPLE=SAMPLE_PEOPLE; PROGRAMS=SAMPLE_PROGRAMS;
    renderAll();
    setStatus('sample','샘플 데이터로 표시 중입니다. 실데이터를 보려면 코드 상단 SCRIPT_URL 에 Apps Script 웹앱 URL 을 입력하세요.');
    return;
  }
  btn.disabled=true;
  setStatus('loading','데이터를 불러오는 중…');
  try{
    const res=await fetch(SCRIPT_URL,{method:'GET'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'알 수 없는 오류');
    PEOPLE=j.data.인원||[]; PROGRAMS=j.data.제도||[];
    TEAMORDER=parseTeamOrder(j.data['팀 순서']||j.data.팀순서);
    QUOTA=parseQuota(j.data['정원']||j.data.정원);
    renderAll();
    setStatus(null);
  }catch(err){
    setStatus('error','데이터를 불러오지 못했습니다: '+err.message+' — SCRIPT_URL/배포 권한(모든 사용자)을 확인하세요.');
    if(!PEOPLE.length){ PEOPLE=SAMPLE_PEOPLE; PROGRAMS=SAMPLE_PROGRAMS; renderAll(); }
  }finally{
    btn.disabled=false;
  }
}

/* ---- 대분류 자동 판별 ----
   제도명에 키워드가 포함되면 해당 대분류로 자동 분류된다.
   (예: '○○휴직' → 휴직, '○○단축' → 단축). 끝말뿐 아니라 포함이면 매칭.
   그 외 매칭되지 않는 제도(파견 등)는 모두 '기타'로 분류된다. */
const CAT_RULES = [
  {cat:"단축", kw:["단축","육아시간"]},
  {cat:"휴가", kw:["휴가","산전후"]},
  {cat:"휴직", kw:["휴직"]},
];
const CATS = CAT_RULES.map(r=>r.cat);
function categoryOf(name){
  name=name||"";
  for(const r of CAT_RULES){ if(r.kw.some(k=>name.includes(k))) return r.cat; }
  return "기타";
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const CAT_COLOR = Object.fromEntries([...CATS,"기타"].map(c=>[c,css('--c-'+c)]));
const colorOf = name => CAT_COLOR[categoryOf(name)];
/* 제도별 조회·범례에 노출할 대분류 (단축/휴가/휴직 + 해당 제도가 있으면 '기타'도) */
const presentCats = () => [...CATS,"기타"].filter(c=>PROGRAMS.some(p=>categoryOf(p.제도)===c));

/* ---- 날짜 유틸 ---- */
/* 빈칸·다양한 표기(YYYY-MM-DD, YYYY.MM.DD, YYYY/MM/DD, "2026. 5. 1" 등)를
   모두 받아 로컬 자정 Date 로 변환. 해석 불가/빈칸이면 null 반환. */
const D = s => {
  if(s==null) return null;
  const t=String(s).trim();
  if(!t) return null;
  const m=t.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  const d = m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(t);
  return isNaN(d.getTime()) ? null : d;
};
/* 로컬(KST 등) 기준 YYYY-MM-DD — UTC 변환을 쓰지 않아 날짜가 밀리지 않음 */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => { const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
let REF = today();
const fmt = d => d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace(/\.$/,'');
const days = (a,b) => Math.round((b-a)/86400000);
const ddText = n => n===0 ? 'D-day' : 'D-'+n;   // 당일은 D-day 로 표기
const nameOf = sb => (PEOPLE.find(p=>p.사번===sb)||{}).사원명 || "(이름없음)";  // 인원 시트에 사번 없으면 표기
const deptOf = sb => (PEOPLE.find(p=>p.사번===sb)||{}).부서||"";

function isActive(p, ref){
  const inn=D(p.입사일), out=D(p.퇴사일);
  return inn && inn<=ref && (!out || ref<=out);
}
function programState(pr, ref){
  const s=D(pr.시작일), e=D(pr.종료일)||new Date(8640000000000000);
  if(!s) return "예정";              // 시작일 미정 → '사용 예정'으로 간주
  if(ref<s) return "예정";
  if(ref>e) return "종료";
  return "현재";
}

/* ================= 인원현황표 (직급별 + 정현원) =================
   - 항상 '조회일(오늘, KST)' 기준으로 집계 (기준일 선택값과 무관).
   - 집계 대상 현원 = 조회일에 재직 중인 전체 인원(isActive: 재직+휴직+파견).
   - 표기값이 실데이터와 다르면 아래 설정 상수만 고치면 됩니다.        */
const RANK_GEN = ["임원","1급","2급","3급","4급","5급","6급"];   // 일반직 직급(순서=열 순서)
const RANK_PRO = ["가급","나급","다급","라급"];                  // 전문직 직급
const PRO_QUOTA_GROUPS = [["가급","나급"],["다급","라급"]];     // 전문직 '정원'은 묶음으로 관리(현원은 직급별, 정원/결원은 묶어서 표시)
const FLAG_SEP = "별도직군";    // 인원 시트 '비고'에 이 문구가 있으면 별도직군으로 분류
const EMP_CONTRACT = "기간제";  // 인원 시트 '고용형태' 값이 이것이면 기간제

const isContract = p => String(p.고용형태||"").trim()===EMP_CONTRACT;
const isSeparate = p => String(p.비고||"").includes(FLAG_SEP);
const rankOf     = p => String(p.직급||"").trim();

/* KST(Asia/Seoul) 기준 오늘 */
function kstYMD(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function kstDate(){ const [y,m,d]=kstYMD().split('-').map(Number); return new Date(y,m-1,d); }

/* '팀 순서' 시트 → 부서 표시 순서 배열 ('표시순서' 열이 있으면 그 값으로 정렬) */
function parseTeamOrder(rows){
  const list=(rows||[]).map((r,i)=>{
    const name=String(r.부서 ?? r.팀 ?? r.팀명 ?? r.구분 ?? Object.values(r)[0] ?? "").trim();
    const o=parseFloat(String(r.표시순서 ?? r.순서 ?? r['표시 순서'] ?? "").replace(/[^\d.-]/g,''));
    const bonbu=String(r.본부 ?? r.소속본부 ?? r['소속 본부'] ?? r.상위 ?? "").trim();
    return {name, ord:isNaN(o)?i+1:o, i, bonbu};
  }).filter(x=>x.name);
  list.sort((a,b)=> a.ord-b.ord || a.i-b.i);
  TEAMORD={}; TEAM_BONBU={}; BONBU_ORDER=[];
  list.forEach((x,idx)=>{
    TEAMORD[x.name]=x.ord||idx+1;
    TEAM_BONBU[x.name]=x.bonbu;
    if(x.bonbu && x.bonbu!=="직속" && !BONBU_ORDER.includes(x.bonbu)) BONBU_ORDER.push(x.bonbu);
  });
  return list.map(x=>x.name);
}
/* 표시순서 구간별 음영 클래스 (1~3 흰색 / 4~9 노랑 / 10~15 주황 / 16~ 초록) */
function teamShade(ord){
  if(ord>=4 && ord<=9) return "shade-y";
  if(ord>=10 && ord<=15) return "shade-o";
  if(ord>=16) return "shade-g";
  return "";
}
/* '정원' 시트 → {직급/구분 → 정원수} 매핑. 가로형(직급이 열)·세로형(구분/정원) 모두 지원 */
function parseQuota(rows){
  const q={}; const KNOWN=new Set([...RANK_GEN,...RANK_PRO,FLAG_SEP,EMP_CONTRACT]);
  const num=v=>{ const n=parseInt(String(v).replace(/[^\d-]/g,''),10); return isNaN(n)?null:n; };
  (rows||[]).forEach(r=>{
    let matched=false;   // 가로형: 행의 열 이름이 직급명이면 그대로 흡수
    Object.keys(r).forEach(k=>{ const kk=String(k).trim(); if(KNOWN.has(kk)){ const v=num(r[k]); if(v!==null){ q[kk]=v; matched=true; } } });
    if(matched) return;
    const label=String(r.구분 ?? r.직급 ?? r.항목 ?? r.명칭 ?? Object.values(r)[0] ?? "").trim();  // 세로형
    const v=num(r.정원 ?? r.정원수 ?? r.인원 ?? r.수 ?? r.값 ?? Object.values(r)[1]);
    if(label && KNOWN.has(label)) q[label]=v??0;
  });
  return q;
}

/* 조회일 기준 부서 목록(팀 순서 우선, 데이터에만 있는 부서는 뒤에 추가) */
function staffTeams(active){
  const seen=[...new Set(active.map(p=>String(p.부서||"").trim()).filter(Boolean))];
  if(!TEAMORDER.length) return seen;
  const list=TEAMORDER.filter(t=>seen.includes(t)||true).slice(); // 팀순서 그대로
  seen.forEach(t=>{ if(!list.includes(t)) list.push(t); });
  return list;
}

/* ================= 조직도 (인원현황표 개편) — 조회일(KST) 기준 ================= */
function orgMemberRank(p){
  if(isContract(p)) return 100;
  const order=["임원","1급","2급","3급","4급","5급","6급","전문직"];
  const i=order.indexOf(ggGradeOf(p)); return i<0?90:i;
}
function orgMemberSort(a,b){
  const la=(String(a.직위||"").trim()==="팀장")?0:1, lb=(String(b.직위||"").trim()==="팀장")?0:1;
  if(la!==lb) return la-lb;   // 팀장 맨 앞
  return orgMemberRank(a)-orgMemberRank(b) || String(a.입사일||"").localeCompare(String(b.입사일||""));
}
function orgChip(p, ref){
  const emp=String(p.고용형태||"").trim();
  const onDisp = emp==="파견" || PROGRAMS.some(pr=>pr.사번===p.사번 && (pr.제도||"").includes("파견") && programState(pr,ref)==="현재");
  const onLeave = statusOf(p,ref)==="휴직";
  const cls = isContract(p) ? "ct" : (onDisp ? "disp" : (onLeave ? "leave" : ""));
  const jg = p.직급 ? `<em>${ggEsc(p.직급)}</em>` : "";
  const pos=String(p.직위||"").trim();
  const posTag = (pos && pos!=="팀원") ? `<span class="org-pos">${ggEsc(pos)}</span>` : "";
  const rep=String(p.대체||"").trim();
  let repTag="";
  if(rep){ const nm=nameOf(rep); const disp=(nm && nm!=="(이름없음)")?nm:rep; repTag=`<span class="org-chip-sub">${ggEsc(disp)}</span>`; }
  const parts=[p.사원명||""]; if(pos) parts.push(pos); if(p.직급) parts.push(p.직급); if(emp) parts.push(emp);
  if(onLeave) parts.push("휴직"); if(onDisp) parts.push("파견"); if(rep) parts.push(`${p.대체}(사번) 대체`);
  const tip=parts.filter(Boolean).join(" · ");
  return `<span class="org-chip ${cls}" title="${ggEsc(tip)}"><span class="org-chip-main">${posTag}${ggEsc(p.사원명)}${jg}</span>${repTag}</span>`;
}
function orgTeamCard(team, byTeam, ref){
  const mem=(byTeam[team]||[]).slice().sort(orgMemberSort);
  const arg = String(team).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  let inner;
  if(!mem.length){ inner='<span class="org-empty">구성원 없음</span>'; }
  else {
    const groups=new Map();   // 근무지별 하위 그룹 (본사·미지정은 라벨 없이 묶음)
    mem.forEach(p=>{ const raw=String(p.근무지||"").trim(); const key=(raw==="본사")?"":raw; if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(p); });
    const keys=[...groups.keys()].sort((a,b)=> (a===""?0:1)-(b===""?0:1));   // 본사/미지정(라벨없음) 먼저
    inner=keys.map(k=>{
      const chips=groups.get(k).map(p=>orgChip(p,ref)).join("");
      const label=k?`<div class="org-loc">${ggEsc(k)} <span class="org-loc-n">${groups.get(k).length}</span></div>`:"";
      return `<div class="org-locgrp">${label}<div class="org-locmem">${chips}</div></div>`;
    }).join("");
  }
  const lead = /대표이사/.test(team) || mem.some(p=>{ const z=String(p.직위||"").trim(); return z==="대표이사"||z==="본부장"; });
  return `<div class="org-team${lead?' lead':''}">
    <button class="org-team-h" onclick="openGGDeptModal('${arg}')"><span class="otname">${ggEsc(team)}</span><span class="otcnt">${mem.length}</span></button>
    <div class="org-mem">${inner}</div>
  </div>`;
}
function renderOrgChart(){
  const ref=kstDate();
  const active=PEOPLE.filter(p=>isActive(p,ref));
  const asOf=document.getElementById('staffAsOf'); if(asOf) asOf.textContent=`· 조회일 ${kstYMD()} (KST) · ${active.length}명`;
  const note=document.getElementById('staffNote');
  if(note){
    if(!BONBU_ORDER.length){ note.style.display='block'; note.textContent="※ '팀 순서' 시트에 '본부' 열이 없어 본부 구분 없이 표시됩니다. 팀별 '본부' 열을 추가하면 조직도로 묶입니다."; }
    else note.style.display='none';
  }
  const byTeam={}; active.forEach(p=>{ const d=(String(p.부서||"").trim())||"(미지정)"; (byTeam[d]=byTeam[d]||[]).push(p); });
  const teams=staffTeams(active);
  const isCEO=t=>/대표이사/.test(t);
  const bonbuOf=t=>{ const b=(TEAM_BONBU[t]||"").trim(); return (!b||b==="직속")?"":b; };
  const ceo=teams.filter(isCEO);
  const rest=teams.filter(t=>!isCEO(t));
  const bonbus=[...BONBU_ORDER]; rest.forEach(t=>{ const b=bonbuOf(t); if(b && !bonbus.includes(b)) bonbus.push(b); });
  const jiksok=rest.filter(t=>!bonbuOf(t));   // 직속 = 본부 미지정(본부 데이터 없으면 전체가 여기로)
  let html="";
  if(ceo.length) html+=`<div class="org-ceo">${ceo.map(t=>orgTeamCard(t,byTeam,ref)).join("")}</div>`;
  if(jiksok.length) html+=`<div class="org-jiksok">${jiksok.map(t=>orgTeamCard(t,byTeam,ref)).join("")}</div>`;
  if(bonbus.length) html+=`<div class="org-bonbus">`+bonbus.map(b=>{
      const bt=rest.filter(t=>bonbuOf(t)===b);
      return `<div class="org-bonbu">${bt.map(t=>orgTeamCard(t,byTeam,ref)).join("")}</div>`;
    }).join("")+`</div>`;
  document.getElementById('orgChart').innerHTML = html || '<div class="empty">표시할 인원이 없습니다.</div>';
}

/* --- 표1: 직급별 인원 현황 (부서×직급, 성별 남/여/계 분할 · 첨부 디자인) --- */
const GG_GRADES = ["임원","1급","2급","3급","4급","5급","6급","전문직"];   // 열 순서(전문직=가~라급/전문직 고용형태 합산)
function ggEsc(s){ return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function ggGradeOf(p){   // 비-기간제 인원의 직급 버킷
  if(String(p.고용형태||"").trim()==="전문직") return "전문직";
  const k=rankOf(p);
  if(k==="임원"||/대표|본부장/.test(k)) return "임원";
  const m=k.match(/^([1-6])급/); if(m) return m[1]+"급";
  if(k.startsWith("전문직")||/^[가나다라]\s*급?$/.test(k)||RANK_PRO.includes(k)) return "전문직";
  return null;   // 알 수 없는 직급(데이터 점검용)
}
function buildGGPivot(active, teams){
  const blank=()=>{ const row={grade:{},gigan:{남:0,여:0}}; GG_GRADES.forEach(g=>row.grade[g]={남:0,여:0}); return row; };
  const rows=new Map(); teams.forEach(d=>rows.set(d,blank()));
  active.forEach(p=>{
    const d=String(p.부서||"").trim()||"(미지정)";
    if(!rows.has(d)) rows.set(d,blank());
    const row=rows.get(d), g=(String(p.성별||"").trim()==="여")?"여":"남";
    if(isContract(p)){ row.gigan[g]++; return; }
    const gb=ggGradeOf(p); if(gb && row.grade[gb]) row.grade[gb][g]++;
  });
  const calc=row=>{
    let sM=0,sF=0; GG_GRADES.forEach(g=>{ sM+=row.grade[g].남; sF+=row.grade[g].여; });
    return { subtotal:{남:sM,여:sF}, gigan:{남:row.gigan.남,여:row.gigan.여}, total:{남:sM+row.gigan.남,여:sF+row.gigan.여} };
  };
  const order=[...teams]; rows.forEach((v,k)=>{ if(!order.includes(k)) order.push(k); });   // 데이터에만 있는 부서 뒤에 추가
  const out=[], totalRow=blank();
  order.forEach(d=>{
    const row=rows.get(d); if(!row) return;
    out.push({dept:d,row,...calc(row)});
    GG_GRADES.forEach(g=>{ totalRow.grade[g].남+=row.grade[g].남; totalRow.grade[g].여+=row.grade[g].여; });
    totalRow.gigan.남+=row.gigan.남; totalRow.gigan.여+=row.gigan.여;
  });
  return { rows:out, total:{dept:"합계",row:totalRow,...calc(totalRow)} };
}
function ggCell(v,cls){ const z=(v===0)?" zero":""; return `<td class="num${z}${cls?" "+cls:""}">${v}</td>`; }
function renderRankTable(active){
  const teams=staffTeams(active);
  const pivot=buildGGPivot(active, teams);
  const gcls=g=>(g==="전문직"?"e-lav":"e-gen");
  let head=`<thead><tr class="group"><th class="dept" rowspan="2">부서</th>`;
  GG_GRADES.forEach(g=>head+=`<th colspan="3" class="sep-left ${gcls(g)} esub">${g}</th>`);
  head+=`<th colspan="3" class="sep-left e-gig esub">소계</th><th colspan="3" class="sep-left e-pink esub">기간제</th><th colspan="3" class="sep-left e-gry2 esub">총계</th></tr><tr>`;
  GG_GRADES.forEach(g=>head+=`<th class="sep-left">남</th><th>여</th><th class="${gcls(g)} esub">계</th>`);
  head+=`<th class="sep-left">남</th><th>여</th><th class="e-gig esub">계</th><th class="sep-left">남</th><th>여</th><th class="e-pink esub">계</th><th class="sep-left">남</th><th>여</th><th class="e-gry2 esub">계</th></tr></thead>`;
  const trio=(cell,cls)=>ggCell(cell.남,"sep-left")+ggCell(cell.여)+ggCell(cell.남+cell.여,"cur "+cls+" esub");
  const renderRow=(r,isTotal)=>{
    const bcls=isTotal?"":(/대표이사/.test(r.dept)?" bb-bot":(/본부$/.test(r.dept)?" bb-top":""));
    let html=`<tr class="${isTotal?"total":""}${bcls}">`;
    html+=`<td class="dept${isTotal?"":" clickable"}"${isTotal?"":` data-dept="${ggEsc(r.dept)}"`}>${ggEsc(r.dept)}</td>`;
    GG_GRADES.forEach(g=>html+=trio(r.row.grade[g],gcls(g)));
    html+=trio(r.subtotal,"e-gig")+trio(r.gigan,"e-pink")+trio(r.total,"e-gry2");
    return html+"</tr>";
  };
  let body="<tbody>";
  pivot.rows.forEach(r=>body+=renderRow(r,false));
  body+=renderRow(pivot.total,true);
  document.getElementById('staffRankTbl').innerHTML=head+body+"</tbody>";
  bindGGDeptClicks();
  setupGGCrosshair();
}
/* 십자(crosshair) 호버 — 표 요소에 1회만 바인딩(innerHTML 교체돼도 유지) */
let ggCrosshairBound=false;
function setupGGCrosshair(){
  if(ggCrosshairBound) return; const table=document.getElementById('staffRankTbl'); if(!table) return; ggCrosshairBound=true;
  let curIdx=-1;
  const clear=()=>{ if(curIdx<0)return; const tb=table.tBodies[0]; if(tb) for(const tr of tb.rows){ const c=tr.cells[curIdx]; if(c)c.classList.remove('col-hl'); } curIdx=-1; };
  table.addEventListener('mouseover',e=>{ const td=e.target.closest('td'); const tb=table.tBodies[0]; if(!td||!tb||!tb.contains(td)){clear();return;} const idx=td.cellIndex; if(idx===curIdx)return; clear(); curIdx=idx; for(const tr of tb.rows){ const c=tr.cells[idx]; if(c)c.classList.add('col-hl'); } });
  table.addEventListener('mouseleave',clear);
}

/* --- 표2: 정현원(정원/현원/결원). 별도직군은 직급칸에서 제외하고 별도 집계 --- */
function finalizeRec(rec){
  rec.genSub=RANK_GEN.reduce((s,r)=>s+(rec[r]||0),0);
  rec.proSub=RANK_PRO.reduce((s,r)=>s+(rec[r]||0),0);
  rec.total =rec.genSub+rec.proSub+(rec.sep||0);  // 정원현황(일반+전문+별도)
  rec.grand =rec.total+(rec.contract||0);          // 합계(+기간제)
  return rec;
}
function quotaRecord(){
  const rec={}; [...RANK_GEN,...RANK_PRO].forEach(r=>rec[r]=QUOTA[r]||0);
  rec.sep=QUOTA[FLAG_SEP]||0; rec.contract=QUOTA[EMP_CONTRACT]||0;
  return finalizeRec(rec);
}
function staffRecord(active){
  const rec={}; [...RANK_GEN,...RANK_PRO].forEach(r=>rec[r]=0); rec.sep=0; rec.contract=0;
  active.forEach(p=>{
    if(isContract(p)){ rec.contract++; return; }
    if(isSeparate(p)){ rec.sep++; return; }
    const r=rankOf(p); if(rec[r]!==undefined) rec[r]++;   // 알 수 없는 직급은 어느 칸에도 안 들어감(데이터 점검용)
  });
  return finalizeRec(rec);
}
function renderQuotaTable(active){
  const q=quotaRecord(), c=staffRecord(active);
  const gsum=(rec,g)=>g.reduce((s,r)=>s+(rec[r]||0),0);
  const head=`<thead>
      <tr>
        <th rowspan="2">구분</th>
        <th colspan="${RANK_GEN.length+1}">일반직</th>
        <th colspan="${RANK_PRO.length+1}">전문직</th>
        <th rowspan="2">별도직군</th><th rowspan="2">정원현황</th><th rowspan="2">기간제</th><th rowspan="2">합계</th>
      </tr>
      <tr>${RANK_GEN.map(r=>`<th>${r}</th>`).join("")}<th>소계</th>${RANK_PRO.map(r=>`<th>${r}</th>`).join("")}<th>소계</th></tr>
    </thead>`;
  /* proMode: 'each'=직급별(현원), 'group'=정원 묶음 표시(정원/결원) */
  const rowHTML=(name,rec,proMode,cls="")=>{
    const isDiff=name==="결원";
    const cell=(v,sum)=>`<td class="${sum?'sumcol':''} ${(isDiff&&v<0)?'neg':''}">${v}</td>`;
    let s=`<tr class="${cls}"><td>${name}</td>`;
    RANK_GEN.forEach(r=>s+=cell(rec[r]||0,false)); s+=cell(rec.genSub||0,true);
    if(proMode==="group"){
      PRO_QUOTA_GROUPS.forEach(g=>{ const v=isDiff?(gsum(c,g)-gsum(q,g)):gsum(rec,g);
        s+=`<td colspan="${g.length}" class="${(isDiff&&v<0)?'neg':''}">${v}</td>`; });
    } else { RANK_PRO.forEach(r=>s+=cell(rec[r]||0,false)); }
    s+=cell(rec.proSub||0,true);
    s+=cell(rec.sep||0,false)+cell(rec.total||0,true)+cell(rec.contract||0,false)+cell(rec.grand||0,true);
    return s+"</tr>";
  };
  const d={}; [...RANK_GEN,...RANK_PRO,"genSub","proSub","sep","total","contract","grand"].forEach(k=>d[k]=(c[k]||0)-(q[k]||0));
  const body=rowHTML("정원",q,"group")+rowHTML("현원",c,"each")+rowHTML("결원",d,"group","sumrow");
  document.getElementById('staffQuotaTbl').innerHTML=head+`<tbody>${body}</tbody>`;
}

function tlWindow(){ const s=new Date(REF); s.setMonth(s.getMonth()-3); const e=new Date(REF); e.setMonth(e.getMonth()+12); return [s,e]; }
function pct(d,[s,e]){ return Math.max(0,Math.min(100, (d-s)/(e-s)*100)); }

function renderTimeline(){
  const [ws,we]=tlWindow();
  const q=(document.getElementById('tlSearch').value||'').trim();
  const rows = PEOPLE.filter(p=>isActive(p,REF) || (D(p.입사일)>REF && D(p.입사일)<=we))
    .filter(p=>PROGRAMS.some(x=>x.사번===p.사번 && D(x.시작일) && D(x.시작일)<=we && (!x.종료일||D(x.종료일)>=ws)))
    .filter(p=> !q || p.사원명.includes(q) || p.부서.includes(q));

  let scale='', m=new Date(ws.getFullYear(),ws.getMonth(),1);
  while(m<=we){ const x=pct(m,[ws,we]); scale+=`<div class="tl-month" style="left:${x}%">${m.getMonth()+1}월${m.getMonth()===0?`<br>${m.getFullYear()}`:''}</div>`; m=new Date(m.getFullYear(),m.getMonth()+1,1); }
  document.getElementById('tlScale').innerHTML=scale;

  const nowX=pct(REF,[ws,we]);
  let body='';
  rows.forEach(p=>{
    const prs=PROGRAMS.filter(x=>x.사번===p.사번 && D(x.시작일) && D(x.시작일)<=we && (!x.종료일||D(x.종료일)>=ws));
    let segs=`<div class="nowline" style="left:${nowX}%"></div>`;
    prs.forEach(pr=>{
      const s=D(pr.시작일), e=D(pr.종료일)||we;
      const L=pct(s,[ws,we]), R=pct(e,[ws,we]);
      const st=programState(pr,REF);
      const label=(pr.제도||"").replace("근로시간 ","");
      segs+=`<div class="seg ${st==='예정'?'future':''}" style="left:${L}%;width:${Math.max(R-L,2)}%;background:${colorOf(pr.제도)}" title="${pr.제도} (${pr.시작일}~${pr.종료일||'미정'})${pr.상세?' · '+pr.상세:''}">${label}${pr.상세?' '+pr.상세:''}</div>`;
    });
    body+=`<div class="tl-row"><div class="tl-name"><div class="nm">${p.사원명}</div><div class="meta">${p.부서} · ${p.직급}</div></div><div class="tl-track">${segs}</div></div>`;
  });
  document.getElementById('tlBody').innerHTML = body || '<div class="empty">기준일 전후로 표시할 제도가 없습니다.</div>';
  document.getElementById('tlSub').textContent = `· ${rows.length}명 (${fmt(ws)} ~ ${fmt(we)})`;

  document.getElementById('legend').innerHTML = presentCats().map(c=>`<span><i style="background:${CAT_COLOR[c]}"></i>${c}</span>`).join('')+
    `<span><i style="background:#bcc1cb;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 4px,transparent 4px 8px)"></i>예정(빗금)</span>`;
}

function ddayBadge(dday,kind){

function curCountOf(cat){ return new Set(PROGRAMS.filter(p=>categoryOf(p.제도)===cat && programState(p,REF)==="현재").map(p=>p.사번)).size; }
function renderProgram(){

  const matches = PROGRAMS.filter(pr=>categoryOf(pr.제도)===activeCat && (activeSub==='전체'||pr.제도===activeSub));

  };
  document.getElementById('curList').innerHTML = cur.length?cur.map(p=>card(p,'cur')).join(''):'<div class="empty">현재 사용 중인 인원이 없습니다.</div>';
  document.getElementById('upList').innerHTML = up.length?up.map(p=>card(p,'up')).join(''):'<div class="empty">예정 인원이 없습니다.</div>';

/* ---- 인사발령 이벤트 ---- */
function allEvents(){
  const ev=[];
  const push=o=>{ if(D(o.date)) ev.push(o); };  // 날짜가 유효한 이벤트만 수집
  PEOPLE.forEach(p=>{
    if(D(p.입사일)) push({date:p.입사일,type:(D(p.입사일)>REF?"입사예정":"입사"),cat:"입사",kind:"입사",사번:p.사번,name:p.사원명,dept:p.부서,color:"#4a8c5c"});
    if(p.퇴사일) push({date:p.퇴사일,type:"퇴사",cat:"퇴사",kind:"퇴사",사번:p.사번,name:p.사원명,dept:p.부서,color:"#A32D2D"});
  });
  PROGRAMS.forEach(pr=>{
    const cat=categoryOf(pr.제도);
    const lbl = cat==="휴직"?"휴직 시작":cat==="휴가"?((pr.제도||"").includes("산전후")?"산전후 시작":"휴가 시작"):"단축 시작";
    push({date:pr.시작일,type:lbl,cat:pr.제도,kind:"시작",사번:pr.사번,name:nameOf(pr.사번),dept:deptOf(pr.사번),color:colorOf(pr.제도)});
    if(pr.종료일 && cat==="휴직") push({date:pr.종료일,type:"휴직 종료",cat:pr.제도,kind:"복직",사번:pr.사번,name:nameOf(pr.사번),dept:deptOf(pr.사번),color:"#3B6D11"});
  });
  return ev;
}
/* 같은 날짜일 때 유형 우선순위: 퇴사 → 휴직시작 → 휴가시작 → 복직 → 단축 → 입사 */
function evPriority(e){
  if(e.kind==="퇴사") return 0;
  if(e.kind==="복직") return 3;
  if(e.kind==="입사") return 5;
  if(e.kind==="시작"){
    const c=categoryOf(e.cat);
    if(c==="휴직") return 1;
    if(c==="휴가") return 2;
    if(c==="단축") return 4;
  }
  return 9;
}
/* 같은 날짜 내 2차 정렬: 유형 우선순위 → 사번 (예정자/D-day/캘린더 공통) */
function evSecondary(a,b){
  return evPriority(a)-evPriority(b)
    || String(a.사번||'').localeCompare(String(b.사번||''),undefined,{numeric:true});
}
function upcomingEvents(){
  return allEvents().map(e=>({...e,dday:days(REF,D(e.date))})).filter(e=>e.dday>=0)
    .sort((a,b)=> a.dday-b.dday || evSecondary(a,b));
}
let ddayPage=0;
const DDAY_PER=7;
function ddayMove(n){ ddayPage+=n; renderDDay(); }
function renderDDay(){
  const all=upcomingEvents();
  const pages=Math.max(1,Math.ceil(all.length/DDAY_PER));
  if(ddayPage>pages-1) ddayPage=pages-1;
  if(ddayPage<0) ddayPage=0;
  const list=all.slice(ddayPage*DDAY_PER, ddayPage*DDAY_PER+DDAY_PER);
  const cards = list.length?list.map(e=>{
    const cls=e.dday<=7?'urgent':e.dday<=30?'soon':'now';
    return `<div class="dcard"><span class="et" style="background:${e.color}">${e.type}</span>
      <div class="info"><div class="n">${e.name} <span style="font-weight:400;color:var(--ink2);font-size:11px">${e.dept}</span></div><div class="dt">${e.date}</div></div>
      <span class="dday ${cls}">${ddText(e.dday)}</span></div>`;
  }).join(''):'<div class="empty">예정 일정이 없습니다.</div>';
  const pager = all.length>DDAY_PER
    ? `<div class="dpager"><button class="btn" ${ddayPage===0?'disabled':''} onclick="ddayMove(-1)">‹ 이전</button><span>${ddayPage+1} / ${pages} (총 ${all.length}건)</span><button class="btn" ${ddayPage>=pages-1?'disabled':''} onclick="ddayMove(1)">다음 ›</button></div>`
    : '';
  document.getElementById('ddayList').innerHTML = cards+pager;
}

/* ---- 휴직자 탭 ---- */
let leaveFilter=null;   // null = 전체, 그 외 = 제도명(유형)
function leaveRows(){
  return PROGRAMS
    .filter(pr=>categoryOf(pr.제도)==="휴직" && programState(pr,REF)==="현재")

    .sort((a,b)=>{ const ea=D(a.end), eb=D(b.end); if(!ea&&!eb) return 0; if(!ea) return 1; if(!eb) return -1; return ea-eb; });
}
function pickLeave(t){ leaveFilter = (leaveFilter===t)?null:t; renderLeave(); }

  }).join('');

      <td>${r.start}</td><td>${r.end||'미정'}</td><td>${rem}</td></tr>`;
  }).join('');
  document.getElementById('leaveWrap').innerHTML=`<table class="rtable"><thead><tr><th>사원명</th><th>부서</th><th>유형</th><th>시작일</th><th>종료일</th><th>남은기간(복직)</th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:var(--ink2);padding:28px">해당 휴직자가 없습니다.</td></tr>'}</tbody></table>`;
}

/* ---- 예정자 탭 ---- */

    return `<tr><td style="font-weight:700">${e.name}</td><td>${e.dept}</td>
      <td><span class="tag" style="background:${e.color}">${e.cat}</span></td>
      <td>${e.kind}</td><td>${e.date}</td><td><span class="dday ${cls}">${ddText(e.dday)}</span></td></tr>`;
  }).join('');
  document.getElementById('upcomingWrap').innerHTML=`<table class="rtable"><thead><tr><th>사원명</th><th>부서</th><th>유형</th><th>종류</th><th>예정일</th><th>남은기간</th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="text-align:center;color:var(--ink2);padding:28px">예정 일정이 없습니다.</td></tr>'}</tbody></table>`;
  document.getElementById('upCntTab').textContent=`${list.length}건`;
}

/* ---- 캘린더 ---- */
let calCursor;
function calMove(n){ calCursor.setMonth(calCursor.getMonth()+n); renderCal(); }
function renderCal(){
  const y=calCursor.getFullYear(), mo=calCursor.getMonth();
  document.getElementById('calLabel').textContent=`${y}년 ${mo+1}월`;
  const start=new Date(y,mo,1).getDay(), dim=new Date(y,mo+1,0).getDate();
  const evByDay={};
  allEvents().forEach(e=>{ const d=D(e.date); if(d && d.getFullYear()===y && d.getMonth()===mo){ (evByDay[d.getDate()]=evByDay[d.getDate()]||[]).push(e);} });
  Object.values(evByDay).forEach(arr=>arr.sort(evSecondary));   // 칸 내부도 유형 우선순위 → 사번 순
  let html='', day=1-start;
  for(let r=0;r<6;r++){ if(day>dim)break; html+='<tr>';
    for(let c=0;c<7;c++,day++){
      if(day<1||day>dim){ html+='<td></td>'; continue; }
      const isToday=(y===REF.getFullYear()&&mo===REF.getMonth()&&day===REF.getDate());
      const dayEvs=evByDay[day]||[];
      const evs=dayEvs.slice(0,2).map(e=>`<span class="ev" style="background:${e.color}" title="${e.name} ${e.type}">${e.name} ${e.type}</span>`).join('');
      const more=dayEvs.length-2;
      const pop=dayEvs.length>2
        ? `<div class="cal-pop"><div class="cal-pop-h">${y}.${mo+1}.${day} · 일정 ${dayEvs.length}건</div>`+
          dayEvs.map(e=>`<div class="cal-pop-row"><i style="background:${e.color}"></i>${e.name} ${e.type}</div>`).join('')+`</div>`
        : '';
      html+=`<td class="${isToday?'today':''}"><span class="d">${day}</span>${evs}${more>0?`<span class="ev" style="background:#aab">+${more}</span>`:''}${pop}</td>`;
    }
    html+='</tr>';
  }
  document.getElementById('calBody').innerHTML=html;
}

/* ---- 전체 명단 ---- */
let rosterFilter="현원";   // 기본: 현원(재직+휴직)
function statusOf(p, ref){
  const inn=D(p.입사일), out=D(p.퇴사일);
  if(!inn || inn>ref) return "입사예정";
  if(out && ref>out) return "퇴사";
  const onLeave = PROGRAMS.some(pr=>pr.사번===p.사번 && categoryOf(pr.제도)==="휴직" && programState(pr,ref)==="현재");
  return onLeave?"휴직":"재직";
}
let rosterSort={key:null,dir:1};
let empFilter="전체";   // 고용형태: 전체 / 정규직 / 기간제
const gv = id => (document.getElementById(id)||{}).value||'';
/* 한 사람의 정보(인적사항·상태) + '기준일에 현재 사용 중'인 제도만 합친 검색 문자열 */
function personHaystack(p){
  const prog=PROGRAMS.filter(pr=>pr.사번===p.사번 && programState(pr,REF)==="현재")
    .map(pr=>[pr.제도,pr.시작일,pr.종료일,pr.상세,pr.비고].join(' ')).join(' ');
  return [p.사번,p.사원명,p.부서,p.직급,p.고용형태,p.입사일,p.퇴사일,p.비고,statusOf(p,REF),prog]
    .join(' ').toLowerCase();
}
function sortRoster(arr){
  const {key,dir}=rosterSort;
  if(!key) return arr;
  const getv={
    사번:x=>{const n=parseInt(x.p.사번,10);return isNaN(n)?x.p.사번:n;},
    직급:x=>{const m=String(x.p.직급||'').match(/\d+/);return m?+m[0]:999;},
    입사일:x=>D(x.p.입사일),
    퇴사일:x=>D(x.p.퇴사일),
  }[key];
  if(!getv) return arr;
  return arr.slice().sort((a,b)=>{
    let va=getv(a), vb=getv(b);
    const na=(va==null||va===''), nb=(vb==null||vb==='');
    if(na&&nb) return 0; if(na) return 1; if(nb) return -1;   // 빈 값은 항상 뒤로
    if(va instanceof Date){ va=va.getTime(); vb=vb.getTime(); }
    return (va>vb?1:va<vb?-1:0)*dir;
  });
}
function rosterList(){
  const q=(document.getElementById('rSearch').value||'').trim().toLowerCase();
  const hf=D(gv('fHireFrom')), ht=D(gv('fHireTo')), lf=D(gv('fLeaveFrom')), lt=D(gv('fLeaveTo'));
  const list = PEOPLE.map(p=>({p,st:statusOf(p,REF)}))
    .filter(x=>rosterFilter==="전체" || (rosterFilter==="현원"?["재직","휴직"].includes(x.st):x.st===rosterFilter))
    .filter(x=> empFilter==="전체" || (empFilter==="기간제" ? x.p.고용형태==="기간제" : x.p.고용형태!=="기간제"))
    .filter(x=>!q||personHaystack(x.p).includes(q))
    .filter(x=>{
      if(hf||ht){ const d=D(x.p.입사일); if(!d) return false; if(hf&&d<hf) return false; if(ht&&d>ht) return false; }
      if(lf||lt){ const d=D(x.p.퇴사일); if(!d) return false; if(lf&&d<lf) return false; if(lt&&d>lt) return false; }
      return true;
    });
  return sortRoster(list);
}
function setRosterFilter(f){ rosterFilter=f; renderRoster(); }
function setEmpFilter(f){ empFilter=f; renderRoster(); }
function setSort(key){ if(rosterSort.key===key) rosterSort.dir*=-1; else { rosterSort.key=key; rosterSort.dir=1; } renderRoster(); }
function sortArrow(key){ return rosterSort.key===key?`<span class="arr">${rosterSort.dir>0?'▲':'▼'}</span>`:''; }
function clearDateFilters(){ ['fHireFrom','fHireTo','fLeaveFrom','fLeaveTo'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';}); renderRoster(); }
function renderRoster(){
  const opts=["현원","재직","휴직","퇴사","입사예정","전체"];
  document.getElementById('rFilters').innerHTML=opts.map(o=>`<button class="subchip ${rosterFilter===o?'on':''}" onclick="setRosterFilter('${o}')">${o}</button>`).join('');
  const empOpts=["전체","정규직","기간제"];
  const ef=document.getElementById('empFilters'); if(ef) ef.innerHTML=empOpts.map(o=>`<button class="subchip ${empFilter===o?'on':''}" onclick="setEmpFilter('${o}')">${o}</button>`).join('');
  const showLeave=["퇴사","전체"].includes(rosterFilter);    // 퇴사일 컬럼은 퇴사·전체에서만
  const showRemark=["퇴사","입사예정"].includes(rosterFilter); // 퇴사·입사예정에선 '현재 사용 제도' 대신 '비고'
  const list=rosterList();
  const rows=list.map(({p,st})=>{
    const cur=PROGRAMS.filter(pr=>pr.사번===p.사번 && programState(pr,REF)==='현재');
    const tags=cur.map(pr=>`<span class="tag" style="background:${colorOf(pr.제도)}" title="${pr.제도}${pr.상세?' '+pr.상세:''}&#10;${pr.시작일} ~ ${pr.종료일||'미정'}">${pr.제도}${pr.상세?' '+pr.상세:''}</span>`).join('');
    const lastCell = showRemark ? `<td>${p.비고||''}</td>` : `<td>${tags}</td>`;
    return `<tr><td><span class="statuschip st-${st}">${st}</span></td><td>${p.사번}</td><td style="font-weight:700">${p.사원명}</td><td>${p.부서}</td><td>${p.직급}</td><td>${p.고용형태}</td><td>${p.입사일}</td>${showLeave?`<td>${p.퇴사일||''}</td>`:''}${lastCell}</tr>`;
  }).join('');
  const th=(label,key)=>key?`<th class="sortable" onclick="setSort('${key}')">${label}${sortArrow(key)}</th>`:`<th>${label}</th>`;
  const head=`<tr>${th('상태')}${th('사번','사번')}${th('사원명')}${th('부서')}${th('직급','직급')}${th('고용형태')}${th('입사일','입사일')}${showLeave?th('퇴사일','퇴사일'):''}${showRemark?th('비고'):th('현재 사용 제도')}</tr>`;
  const cols=showLeave?9:8;
  document.getElementById('rosterWrap').innerHTML=`<table class="rtable"><thead>${head}</thead><tbody>${rows||`<tr><td colspan="${cols}" style="text-align:center;color:var(--ink2);padding:28px">해당 인원이 없습니다.</td></tr>`}</tbody></table>`;
  document.getElementById('rCnt').textContent=`${list.length}명 (${fmt(REF)} · ${rosterFilter})`;
}

/* ---- CSV ---- */
function dl(name,rows){
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${(c??'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click();
}
function exportCSV(){
  const rows=[["상태","사번","사원명","성별","부서","직급","고용형태","입사일","퇴사일","현재 사용 제도"]];
  rosterList().forEach(({p,st})=>{
    const cur=PROGRAMS.filter(pr=>pr.사번===p.사번 && programState(pr,REF)==="현재").map(pr=>pr.제도+(pr.상세?' '+pr.상세:'')).join(' / ');
    rows.push([st,p.사번,p.사원명,p.성별||'',p.부서,p.직급,p.고용형태,p.입사일,p.퇴사일||'',cur]);
  });
  dl(`명단_${rosterFilter}_${ymd(REF)}.csv`,rows);
}
function exportProgram(which){
  const matches=PROGRAMS.filter(pr=>categoryOf(pr.제도)===activeCat && (activeSub==='전체'||pr.제도===activeSub) && programState(pr,REF)===(which==='cur'?'현재':'예정'));
  const rows=[["사번","사원명","부서","제도","시작일","종료일","상세"]];
  matches.forEach(pr=>rows.push([pr.사번,nameOf(pr.사번),deptOf(pr.사번),pr.제도,pr.시작일,pr.종료일,pr.상세]));
  dl(`${activeCat}_${activeSub}_${which==='cur'?'사용중':'예정'}.csv`,rows);
}

function renderAll(){ renderKPIs(); renderOrgChart(); renderLeave(); renderUpcoming(); renderTimeline(); renderProgram(); renderDDay(); renderCal(); renderRoster(); }

calCursor=new Date(today().getFullYear(),today().getMonth(),1);
loadData();
